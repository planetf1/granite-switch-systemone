[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "granite-switch-systemone"
version = "0.1.0"
description = "jev system-one (/v1/systemone) and OpenAI Decisions (/v1/decisions) APIs as vLLM endpoint plugins for granite-switch, mounted alongside /v1/chat/completions on the same server."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
# fastapi/pydantic/starlette are already runtime dependencies of vllm (which the
# container this ships in always has installed) -- not re-declared here on purpose,
# to use whatever versions the vLLM image already pins rather than risking a resolver
# conflict against them.
dependencies = []

[project.optional-dependencies]
# fastapi/pydantic are vllm's own runtime dependencies; declared here only for
# running this package's own tests/lint outside a vLLM container (e.g. in CI).
# httpx backs fastapi's TestClient for the route-level tests in test_decisions.py;
# jsonschema validates /v1/decisions against OpenAI's spec in test_openai_spec.py.
dev = ["fastapi", "pydantic", "pytest", "ruff", "httpx", "jsonschema"]

[project.entry-points."vllm.endpoint_plugins"]
granite_switch_systemone = "granite_switch_systemone.plugin:register"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 119
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["granite_switch_systemone"]
